<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>铁路货车智能检修系统 - 登录</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="login-body">
    <div class="login-shell">
      <div class="login-panel left-panel">
        <div class="brand-wrap brand-auth">
          <div class="brand-mark">铁</div>
          <div>
            <div class="brand-title">检修决策平台</div>
            <div class="brand-subtitle">Rail Freight Check</div>
          </div>
        </div>

        <h1>铁路货车智能检修系统</h1>
        <p class="hero-copy">
          面向轮轴数字身份、工位数据采集和生产调度的一体化检修协同平台。
        </p>

        <div class="login-metrics">
          <div>
            <strong>8,420</strong>
            <span>轮轴档案</span>
          </div>
          <div>
            <strong>94.2%</strong>
            <span>设备上传率</span>
          </div>
          <div>
            <strong>1,348</strong>
            <span>待办任务</span>
          </div>
        </div>
      </div>

      <div class="login-panel form-panel">
        <div class="login-header">
          <div class="eyebrow">系统入口</div>
          <h2>欢迎登录</h2>
        </div>

        <form class="login-form">
          <label>
            <span>用户名</span>
            <input type="text" value="admin@railcheck" />
          </label>

          <label>
            <span>密码</span>
            <input type="password" value="********" />
          </label>

          <div class="form-row">
            <label class="checkbox-row">
              <input type="checkbox" checked />
              <span>记住账号</span>
            </label>
            <a href="#">忘记密码？</a>
          </div>

          <a class="primary-btn login-btn" href="index.html">登录系统</a>
        </form>

        <div class="login-footer">
          <button class="ghost-btn small-btn">扫码登录</button>
          <button class="ghost-btn small-btn">本地单点登录</button>
        </div>
      </div>
    </div>
  </body>
</html>
