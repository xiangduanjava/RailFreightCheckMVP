server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: railfreight-check-backend
  datasource:
    # 默认：H2 内存库（MODE=MySQL 兼容），供本地开发/验证，无需外部数据库
    url: jdbc:h2:mem:railfreight;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    org.hibernate.SQL: warn
